[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lanlord"
version = "1.0.0"
description = "Terminal-based interactive network IP & port scanner"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.47.0",
    "rich>=13.0",
    "psutil>=5.9",
]

[project.scripts]
lanlord = "scanner.main:main"

[tool.setuptools.packages.find]
include = ["scanner*"]
